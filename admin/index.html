<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rankings — Juegos Olla Gitana</title>
<style>
  :root{--bg:#0b0705;--card:#17100a;--line:rgba(255,255,255,.14);--gold:#facc15;--muted:rgba(255,255,255,.55)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#3a1d07 0%,var(--bg) 60%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:18px 14px 40px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:clamp(22px,5vw,30px);margin:4px 0 6px;color:var(--gold);font-weight:900}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  select,input,button{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:13.5px}
  button{cursor:pointer;font-weight:800}
  button.primary{background:linear-gradient(180deg,#34d399,#15803d);border-color:#fff}
  button.danger{background:#7f1d1d;border-color:#f87171}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:rgba(255,255,255,.03)}
  tr:hover td{background:rgba(255,255,255,.03)}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .msg{margin:10px 0;font-size:13px;color:#fde68a;min-height:18px}
  .empty{padding:18px;text-align:center;color:var(--muted)}
  a{color:var(--gold)}
  .del{background:#3f1d1d;border:1px solid #b91c1c;color:#fecaca;border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 Rankings de los juegos</h1>
  <div class="sub">Rankings de los juegos · <a href="../">volver a los juegos</a></div>

  <div class="bar">
    <select id="fGame">
      <option value="">Todos los juegos</option>
      <option value="cartas">Siete y Media (cartas)</option>
      <option value="runner">La Huerta Runner</option>
      <option value="arcade">El Juego (arcade)</option>
      <option value="ritmo">El Ritmo</option>
    </select>
    <select id="fDiff">
      <option value="">Todas las dificultades</option>
      <option value="easy">Fácil</option>
      <option value="normal">Normal</option>
      <option value="hard">Canalla / Difícil</option>
    </select>
    <button id="btnRefresh" class="primary">↻ Actualizar</button>
    <input id="token" placeholder="Token de administración (para borrar)" style="min-width:230px">
    <button id="btnWipe" class="danger">🗑️ Borrar filtradas</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="card">
    <table>
      <thead><tr><th>#</th><th>Juego</th><th>Dif.</th><th>Nombre</th><th>Combo</th><th>Puntos</th><th>Fecha</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">Cargando…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const API = (() => {
  const p = location.pathname;                 // '/juegos-olla/admin/…' o '/champi/admin/…'
  let i = p.indexOf('/juegos-olla');
  if (i >= 0) return p.slice(0, i + '/juegos-olla'.length) + '/api';
  i = p.indexOf('/champi');
  if (i >= 0) return p.slice(0, i + '/champi'.length) + '/api';
  return '/api';
})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cache = [];

async function load() {
  $('#rows').innerHTML = '<tr><td colspan="8" class="empty">Cargando…</td></tr>';
  try {
    const res = await fetch(API + '/all', { cache: 'no-store' });
    const data = await res.json();
    cache = data.scores || [];
    render();
    $('#msg').textContent = `${cache.length} puntuaciones guardadas en el servidor.`;
  } catch (e) {
    $('#rows').innerHTML = '<tr><td colspan="8" class="empty">No se pudo conectar con el servidor.</td></tr>';
  }
}
function render() {
  const g = $('#fGame').value, d = $('#fDiff').value;
  const rows = cache.filter(r => (!g || r.game === g) && (!d || r.diff === d));
  if (!rows.length) { $('#rows').innerHTML = '<tr><td colspan="8" class="empty">Sin puntuaciones con ese filtro.</td></tr>'; return; }
  $('#rows').innerHTML = rows.map((r, i) => `<tr>
    <td>${i + 1}</td>
    <td><span class="pill">${esc(r.game)}</span></td>
    <td>${esc(r.diff)}</td>
    <td>${esc(r.name)}</td>
    <td>${r.combo ? 'x' + esc(r.combo) : '—'}</td>
    <td><b>${esc(r.score)}</b></td>
    <td style="color:var(--muted)">${r.ts ? new Date(r.ts).toLocaleString('es-ES') : '—'}</td>
    <td><button class="del" data-id="${esc(r.id)}">borrar</button></td>
  </tr>`).join('');
}
$('#rows').addEventListener('click', async e => {
  const b = e.target.closest('.del'); if (!b) return;
  const t = $('#token').value.trim();
  if (!t) { $('#msg').textContent = 'Pega el token de administración para borrar.'; return; }
  const res = await fetch(API + '/score?id=' + encodeURIComponent(b.dataset.id), { method: 'DELETE', headers: { 'X-Admin-Token': t } });
  const j = await res.json();
  $('#msg').textContent = res.ok ? `Borrada. Quedan ${j.quedan}.` : ('Error: ' + (j.error || res.status));
  if (res.ok) load();
});
$('#btnWipe').addEventListener('click', async () => {
  const t = $('#token').value.trim();
  if (!t) { $('#msg').textContent = 'Pega el token de administración para borrar.'; return; }
  const g = $('#fGame').value, d = $('#fDiff').value;
  if (!g && !d) { $('#msg').textContent = 'Elige al menos un filtro (juego o dificultad) para borrar en bloque.'; return; }
  if (!confirm('¿Borrar las puntuaciones que cumplen el filtro?')) return;
  const res = await fetch(`${API}/score?all=1&game=${encodeURIComponent(g)}&diff=${encodeURIComponent(d)}`,
                          { method: 'DELETE', headers: { 'X-Admin-Token': t } });
  const j = await res.json();
  $('#msg').textContent = res.ok ? `Borradas ${j.borradas}.` : ('Error: ' + (j.error || res.status));
  if (res.ok) load();
});
$('#btnRefresh').addEventListener('click', load);
$('#fGame').addEventListener('change', render);
$('#fDiff').addEventListener('change', render);
load();
</script>
</body>
</html>
